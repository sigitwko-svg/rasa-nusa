    function setPosCat(c) { posCategory = c; renderCurrentView(); }
    function addPosCart(id) {
      var p = (APP.products || []).find(function(x) { return x.id === id; });
      if (!p || p.stock <= 0) { showToast("Stok menu habis!"); return; }
      var ex = cart.find(function(c) { return c.id === id; });
      if (ex) ex.qty += 1; else cart.push({ id: p.id, name: p.name, price: p.price, qty: 1, emoji: p.emoji });
      renderShell(); renderCurrentView();
    }
    function updPosQty(id, d) {
      cart = cart.map(function(c) { return c.id === id ? Object.assign({}, c, { qty: c.qty + d }) : c; }).filter(function(c) { return c.qty > 0; });
      renderShell(); renderCurrentView();
    }
    function processPosCheckout(sub, disc, tax, grand) {
      if (cart.length === 0) { showToast("Keranjang masih kosong!"); return; }
      var now = new Date();
      var timeStr = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0") + " WIB";
      var newOrd = {
        id: "ORD-" + Math.floor(1000 + Math.random() * 9000),
        customerName: posCustomer || "Pelanggan Umum",
        customerPhone: posPhone || "",
        cashierName: activeUser.name,
        orderType: posOrderType,
        tableNumber: posOrderType === "Dine-In" ? posTable : "-",
        source: "POS Kasir",
        time: timeStr,
        status: "Baru Masuk",
        paymentMethod: posPayment,
        subtotal: sub, discount: disc, tax: tax, total: grand,
        items: cart.slice()
      };
      APP.products = (APP.products || []).map(function(p) {
        var ci = cart.find(function(c) { return c.id === p.id; });
        return ci ? Object.assign({}, p, { stock: Math.max(0, p.stock - ci.qty) }) : p;
      });
      APP.orders.unshift(newOrd);
      cart = [];
      saveStateLocal();
      sendOrderToCloud(newOrd);
      renderShell(); renderCurrentView();
      openReceiptModal(newOrd.id);
      showToast("Transaksi " + newOrd.id + " berhasil disimpan!");
    }

          '<div class="flex items-center gap-4 bg-slate-900 text-white p-4 rounded-2xl">' + getLogoHtml("w-14 h-14 text-2xl") + '<div><div class="font-extrabold text-sm">' + APP.storeProfile.name + '</div><div class="text-xs text-slate-400">' + APP.storeProfile.tagline + '</div></div></div>' +
          '<div class="space-y-2 text-xs"><label class="font-bold block">Upload File Gambar Logo Baru</label><input type="file" accept="image/*" onchange="uploadNewLogo(event)" class="w-full text-xs" /></div>' +
          '<div class="space-y-2 text-xs"><label class="font-bold block">Nama Toko / Restoran</label><input id="set-name" value="' + APP.storeProfile.name + '" class="w-full px-3 py-2 border rounded-xl font-bold" /></div>' +
          '<div class="space-y-2 text-xs"><label class="font-bold block">Slogan / Tagline</label><input id="set-tag" value="' + APP.storeProfile.tagline + '" class="w-full px-3 py-2 border rounded-xl" /></div>' +
          '<div class="grid grid-cols-2 gap-2 text-xs"><div><label class="font-bold block">No. WhatsApp Kasir</label><input id="set-wa" value="' + APP.storeProfile.whatsapp + '" class="w-full px-3 py-2 border rounded-xl font-bold" /></div><div><label class="font-bold block">Pajak PB1 (%)</label><input id="set-tax" type="number" value="' + APP.posConfig.taxRate + '" class="w-full px-3 py-2 border rounded-xl font-bold" /></div></div>' +
          '<button onclick="saveBrandSettings()" class="w-full py-2.5 rounded-xl bg-slate-900 text-white font-bold text-xs">💾 Simpan Profil, Logo & Pajak</button></div>' +
        '<div class="bg-white p-6 rounded-2xl border space-y-4"><h3 class="font-extrabold text-sm border-b pb-2">🔐 2. Pengaturan Username, Password & PIN Kasir</h3>' +
          '<div class="space-y-2 text-xs"><label class="font-bold block">Nama Kasir Aktif</label><input id="set-u-name" value="' + activeUser.name + '" class="w-full px-3 py-2 border rounded-xl font-bold" /></div>' +
          '<div class="grid grid-cols-2 gap-2 text-xs"><div><label class="font-bold block">Username Login</label><input id="set-u-user" value="' + activeUser.username + '" class="w-full px-3 py-2 border rounded-xl font-bold text-orange-600" /></div><div><label class="font-bold block">PIN Cepat (4 Digit)</label><input id="set-u-pin" maxlength="4" value="' + activeUser.pin + '" class="w-full px-3 py-2 border rounded-xl font-bold text-center" /></div></div>' +
          '<div class="space-y-2 text-xs"><label class="font-bold block">Password Baru</label><input id="set-u-pass" type="text" value="' + activeUser.password + '" class="w-full px-3 py-2 border rounded-xl font-bold" /></div>' +
          '<button onclick="saveUserSettings()" class="w-full py-2.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs">🔐 Simpan Username & Password</button>' +
          '<div class="p-3.5 rounded-xl bg-emerald-50 border border-emerald-200 text-xs space-y-1"><div class="font-extrabold text-emerald-900">☁️ Penyimpanan 1 Folder Google Drive Aktif</div><p class="text-[11px] text-emerald-800">Folder Utama: <b>/' + APP.cloudConfig.rootFolderName + '/</b></p><p class="text-[11px] text-emerald-800">Licensed by <b>Arraihan Academy (developwebapp11@gmail.com)</b></p></div></div></div>';
    }

    function uploadNewLogo(ev) {
      var file = ev.target.files && ev.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        APP.storeProfile.logoType = "image";
        APP.storeProfile.logoImageUrl = e.target.result;
        saveStateLocal(); renderShell(); renderCurrentView();
        showToast("Logo toko berhasil diperbarui!");
      };
      reader.readAsDataURL(file);
    }
    function saveBrandSettings() {
      APP.storeProfile.name = document.getElementById("set-name").value || APP.storeProfile.name;
      APP.storeProfile.tagline = document.getElementById("set-tag").value || APP.storeProfile.tagline;
      APP.storeProfile.whatsapp = document.getElementById("set-wa").value || APP.storeProfile.whatsapp;
      APP.posConfig.taxRate = Number(document.getElementById("set-tax").value || 0);
      APP.posConfig.enableTax = APP.posConfig.taxRate > 0;
      saveStateLocal(); syncToDrive(); renderShell(); renderCurrentView();
      showToast("Profil Toko & Pajak berhasil disimpan!");
    }
    function saveUserSettings() {
      activeUser.name = document.getElementById("set-u-name").value || activeUser.name;
      activeUser.username = document.getElementById("set-u-user").value || activeUser.username;
      activeUser.pin = document.getElementById("set-u-pin").value || activeUser.pin;
      activeUser.password = document.getElementById("set-u-pass").value || activeUser.password;
      APP.staffList[0] = activeUser;
      saveStateLocal(); renderShell(); renderCurrentView();
      showToast("Username & Password berhasil diperbarui!");
    }

    // MODAL STRUK & WHATSAPP
    function openReceiptModal(ordId) {
      var o = (APP.orders || []).find(function(x) { return x.id === ordId; });
      if (!o) return;
      var m = document.getElementById("modal-container");
      var itemsRows = (o.items || []).map(function(i) { return '<div class="flex justify-between text-xs"><span>' + i.name + " (x" + i.qty + ')</span><b>' + formatIDR(i.price * i.qty) + '</b></div>'; }).join("");
      m.innerHTML = '<div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-3"><div class="text-center border-b border-dashed pb-3"><div class="flex justify-center mb-2">' + getLogoHtml("w-12 h-12 text-xl") + '</div><h3 class="font-extrabold text-sm">' + APP.storeProfile.name + '</h3><p class="text-[11px] text-slate-500">' + APP.storeProfile.address + '</p><p class="text-[10px] text-orange-600 font-bold mt-1">' + o.id + " • " + o.time + '</p></div>' +
        '<div class="text-xs space-y-1 border-b border-dashed pb-2"><div class="flex justify-between"><span>Pelanggan:</span><b>' + o.customerName + '</b></div><div class="flex justify-between"><span>Metode:</span><b>' + o.paymentMethod + '</b></div></div>' +
        '<div class="space-y-1.5 border-b border-dashed pb-2">' + itemsRows + '</div>' +
        '<div class="flex justify-between font-extrabold text-sm"><span>TOTAL LUNAS</span><span class="text-orange-600">' + formatIDR(o.total) + '</span></div>' +
        '<div class="text-center text-[9.5px] text-slate-400 pt-1">Licensed by Arraihan Academy (developwebapp11@gmail.com)</div>' +
        '<button onclick="sendWhatsAppOrder(\'' + o.id + '\', \'receipt\')" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-bold">💬 Kirim Struk ke WhatsApp Pelanggan</button>' +
        '<div class="flex gap-2"><button onclick="window.print()" class="flex-1 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold">🖨️ Cetak</button><button onclick="closeModal()" class="px-4 py-2 rounded-xl border text-xs font-bold">Tutup</button></div></div>';
      m.classList.remove("hidden");
    }

    function sendWhatsAppOrder(ordId, type) {
      var o = (APP.orders || []).find(function(x) { return x.id === ordId; });
      if (!o) return;
      var itemsTxt = (o.items || []).map(function(i) { return "• " + i.name + " (" + i.qty + "x) = " + formatIDR(i.price * i.qty); }).join(NL);
      var msg = type === "ready"
        ? ("🔔 *PESANAN SIAP DIAMBIL!*" + NL + "Halo Kak *" + o.customerName + "*, pesanan *" + o.id + "* di *" + APP.storeProfile.name + "* sudah siap disajikan!" + NL + NL + itemsTxt + NL + NL + "Selamat menikmati! 🍽️")
        : ("🧾 *STRUK DIGITAL - " + APP.storeProfile.name + "*" + NL + "No. Order: *" + o.id + "*" + NL + "Pelanggan: *" + o.customerName + "*" + NL + "------------------------" + NL + itemsTxt + NL + "------------------------" + NL + "*TOTAL LUNAS: " + formatIDR(o.total) + "*" + NL + "Terima kasih! 🙏");
      var targetPhone = normalizeWA(o.customerPhone || APP.storeProfile.whatsapp);
      window.open("https://wa.me/" + targetPhone + "?text=" + encodeURIComponent(msg), "_blank");
    }

    function openLockModal() {
      var m = document.getElementById("modal-container");
      m.innerHTML = '<div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4"><div class="text-center"><div class="flex justify-center mb-2">' + getLogoHtml("w-12 h-12 text-xl") + '</div><h3 class="font-extrabold text-base">🔒 Kunci Layar / Ganti Shift Kasir</h3><p class="text-xs text-slate-500">Masukkan Username & Password Kasir</p></div>' +
        '<input id="l-user" value="' + activeUser.username + '" placeholder="Username" class="w-full px-3.5 py-2 border rounded-xl text-xs font-bold" />' +
        '<input id="l-pass" type="password" placeholder="Password (default: ' + activeUser.password + ')" class="w-full px-3.5 py-2 border rounded-xl text-xs font-bold" />' +
        '<div class="flex gap-2"><button onclick="verifyUnlock()" class="flex-1 py-2.5 rounded-xl bg-orange-500 text-white text-xs font-bold">🔓 Buka Kasir</button><button onclick="closeModal()" class="px-4 py-2.5 rounded-xl border text-xs font-bold">Batal</button></div></div>';
      m.classList.remove("hidden");
    }
    function verifyUnlock() {
      var u = document.getElementById("l-user").value;
      var p = document.getElementById("l-pass").value;
      var matched = (APP.staffList || []).find(function(s) { return s.username.toLowerCase() === u.toLowerCase() && (s.password === p || s.pin === p); });
      if (matched || p === activeUser.password) {
        if (matched) activeUser = matched;
        closeModal(); renderShell(); renderCurrentView(); showToast("Selamat bertugas, " + activeUser.name + "!");
      } else { showToast("Username atau Password salah!"); }
    }
    function closeModal() { document.getElementById("modal-container").classList.add("hidden"); }

    // SINKRONISASI KE 1 FOLDER GOOGLE DRIVE (GAS / FETCH)
    function sendOrderToCloud(ord) {
      if (window.google && window.google.script && window.google.script.run) {
        try { window.google.script.run.doPost({ postData: { contents: JSON.stringify({ action: "SAVE_ORDER", data: ord }) } }); } catch (e) {}
      } else if (APP.cloudConfig && APP.cloudConfig.gasWebAppUrl) {
        fetch(APP.cloudConfig.gasWebAppUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "SAVE_ORDER", data: ord }) }).catch(function(){});
      }
    }
    function syncToDrive() {
      saveStateLocal();
      if (APP.cloudConfig && APP.cloudConfig.gasWebAppUrl) {
        fetch(APP.cloudConfig.gasWebAppUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "SYNC_ALL_TO_SINGLE_FOLDER", data: APP }) }).catch(function(){});
      }
      showToast("Data berhasil disimpan ke 1 Folder Drive (/" + APP.cloudConfig.rootFolderName + "/)!");
    }

    // INISIALISASI SAAT HALAMAN DIMUAT
    switchTab("pos");
  </script>
</body>
</html>
